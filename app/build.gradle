plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub workflow).
// Without them (e.g. a local Android Studio build) the debug key is used.
def ksPath = System.getenv("KEYSTORE_FILE")
def hasKeystore = ksPath != null && new File(ksPath).exists()

android {
    namespace 'com.shivarghya.upivoice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.shivarghya.upivoice'
        minSdk 26          // Poco M3 ships Android 10+ (MIUI 12/13)
        targetSdk 34
        versionCode 13
        versionName '13.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }   // Poco M3 is arm64; keeps the APK small
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile new File(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies {
    // QR code drawing only (shrunk by R8 to a few KB of what's used)
    implementation 'com.google.zxing:core:3.5.3'

    // Scan & Pay: camera + Google ML Kit QR scanner (bundled model → works offline, good in low light)
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.guava:listenablefuture:1.0'
    // Align Kotlin stdlib versions pulled in by AndroidX / ML Kit (avoids duplicate classes)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
